name: GRMC income projection
on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 0'   # weekly, after the schedule is usually updated
permissions:
  contents: read
concurrency:
  group: grmc-invoices
  cancel-in-progress: false
jobs:
  project:
    if: vars.INVOICING_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: Project GRMC income into the tracker
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SCHEDULE_ID: ${{ secrets.SCHEDULE_ID }}
          TRACKER_ID: ${{ secrets.TRACKER_ID }}
          PROJECTION_TAB: ${{ vars.PROJECTION_TAB }}
          TELE1_RATE: ${{ vars.TELE1_RATE }}
          TELE2_RATE: ${{ vars.TELE2_RATE }}
        run: python project.py
