name: Keep schedules enabled
# GitHub disables scheduled workflows in a public repository after 60 days without
# repository activity. Re-enabling each workflow through the API resets that timer
# without adding commits. This workflow includes itself, so it keeps itself alive too.
on:
  schedule:
    - cron: '7 19 1 * *'   # 1st of each month, 09:07 Hawaii time
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable every workflow in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for id in $(gh api "repos/$REPO/actions/workflows" --jq '.workflows[].id'); do
            gh api -X PUT "repos/$REPO/actions/workflows/$id/enable"
          done
          echo "Re-enabled all workflows; the 60-day inactivity timer is reset."
